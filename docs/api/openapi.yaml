openapi: 3.1.0
info:
  title: MoneyWise API
  description: |
    API REST do MoneyWise.

    ## Formato de erro
    Todo erro segue o formato `ErrorResponse`:
    `code` (identificador estável para o app), `message` (texto em português)
    e `fields` (campos inválidos; vazio quando não se aplica).

    | Status | Quando |
    |---|---|
    | 400 | Dados inválidos (Bean Validation) ou requisição mal formatada |
    | 403 | O usuário não tem permissão para a operação |
    | 404 | Recurso não encontrado |
    | 409 | Conflito, como e-mail já cadastrado |
    | 422 | Regra de negócio violada, como alterar transação de mês fechado |
    | 500 | Erro inesperado no servidor |

    O 422 é usado quando a requisição está bem formada, mas viola uma regra de
    negócio (RN). O 400 fica reservado para dados mal formados ou inválidos.
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: Grupos
  description: "Grupos e Caixinhas do usuário autenticado, membros e convites"
- name: Transações
  description: Consulta e manutenção de transações do usuário autenticado
- name: Relatórios
  description: Resumo financeiro mensal do usuário autenticado
- name: Autenticação
  description: Cadastro e login
- name: Metas
  description: Caixinhas dos grupos e Termômetro
paths:
  /api/v1/transactions/{id}:
    put:
      tags:
      - Transações
      summary: Editar transação
      description: Atualiza transação própria. updatedAt evita que uma alteração antiga
        sobrescreva a mais recente; registros de outro usuário ou de mês fechado não
        são editáveis.
      operationId: updateTransaction
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTransactionRequestDTO"
        required: true
      responses:
        "404":
          description: Transação não encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Transação em mês fechado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Dados inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Transação atualizada ou versão mais recente devolvida
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionResponseDTO"
      security:
      - BearerAuth: []
    delete:
      tags:
      - Transações
      summary: Excluir transação
      description: Exclui transação própria. Registro de outro usuário retorna 404;
        mês fechado não pode ser excluído.
      operationId: deleteTransaction
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Transação não encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Transação em mês fechado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "204":
          description: Transação excluída
      security:
      - BearerAuth: []
  /api/v1/goals/{id}:
    get:
      tags:
      - Metas
      summary: Detalhar meta
      description: "Dados da meta (nome, valor, prazo, ícone, categoria, lembrete,\
        \ marcos, arquivada). O progresso e a soma por membro estão em GET /goals/{id}/thermometer.\
        \ Só membros do grupo acessam."
      operationId: getGoal
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Meta não encontrada ou de um grupo do qual não é membro
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Unprocessable Content
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Meta
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GoalResponseDTO"
      security:
      - BearerAuth: []
    put:
      tags:
      - Metas
      summary: Editar meta
      description: "Substitui os dados editáveis da meta; campo opcional enviado como\
        \ null é apagado (prazo null = meta sem prazo). Só o Admin edita (L-17): membro\
        \ comum não altera o valor da meta nem os outros campos (RN04). A moeda nã\
        o muda (AD-12). O prazo novo não pode estar no passado; um prazo que não mudou\
        \ não é validado de novo. Meta arquivada precisa ser desarquivada antes."
      operationId: updateGoal
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoalRequestDTO"
        required: true
      responses:
        "404":
          description: Meta não encontrada ou de um grupo do qual não é membro
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Membro que não é Admin (L-17, RN04)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Prazo no passado (INVALID_GOAL_DEADLINE) ou meta arquivada
            (GOAL_ARCHIVED)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: "Dados inválidos (ex.: valor da meta zero ou negativo)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Meta editada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GoalResponseDTO"
      security:
      - BearerAuth: []
    delete:
      tags:
      - Metas
      summary: Excluir meta
      description: "Exclui a Caixinha e todo o histórico de movimentos. Só o Admin\
        \ (L-17) e só sem valor acumulado: com saldo, é preciso retirar o valor ou\
        \ arquivar a meta."
      operationId: deleteGoal
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Meta não encontrada ou de um grupo do qual não é membro
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Membro que não é Admin (L-17)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Meta com valor acumulado (GOAL_HAS_BALANCE)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "204":
          description: Meta excluída
      security:
      - BearerAuth: []
  /api/v1/transactions:
    get:
      tags:
      - Transações
      summary: Listar transações
      description: "Lista apenas as transações do usuário autenticado, com filtros\
        \ combináveis. A ordenação é por data e ID decrescentes. A página começa em\
        \ zero; o tamanho padrão é 20 e o máximo é 100."
      operationId: listTransactions
      parameters:
      - name: category
        in: query
        description: Filtro opcional por categoria; espaços externos são removidos
        required: false
        schema:
          type: string
      - name: from
        in: query
        description: Data inicial inclusiva no formato AAAA-MM-DD
        required: false
        schema:
          type: string
          format: date
        example: 2026-10-01
      - name: to
        in: query
        description: Data final inclusiva no formato AAAA-MM-DD
        required: false
        schema:
          type: string
          format: date
        example: 2026-10-31
      - name: page
        in: query
        description: "Índice da página, começando em zero"
        required: false
        schema:
          type: integer
          format: int32
          default: 0
        example: 0
      - name: size
        in: query
        description: Quantidade de itens por página (1 a 100)
        required: false
        schema:
          type: integer
          format: int32
          default: 20
        example: 20
      responses:
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Unprocessable Content
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Filtros ou paginação inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Página de transações
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionPageResponseDTO"
      security:
      - BearerAuth: []
    post:
      tags:
      - Transações
      summary: Criar transação
      description: Cria transação com ID do cliente; reenvio do mesmo ID pelo mesmo
        usuário é idempotente. A moeda vem do perfil. Transações de mês fechado são
        rejeitadas.
      operationId: createTransaction
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionRequestDTO"
        required: true
      responses:
        "404":
          description: Usuário não encontrado ou ID pertence a outro usuário
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Transação em mês fechado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Dados inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "201":
          description: Transação criada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionResponseDTO"
      security:
      - BearerAuth: []
  /api/v1/invitations/{code}/accept:
    post:
      tags:
      - Grupos
      summary: Aceitar convite
      description: "Inclui o usuário autenticado como membro do grupo. O convite é\
        \ de uso único e vale 7 dias. Quem já participa do grupo recebe o grupo, sem\
        \ duplicar o membro, e o convite continua disponível para outra pessoa."
      operationId: acceptGroupInvitation
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        "404":
          description: Convite não encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Convite expirado ou já aceito
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Usuário é membro do grupo
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GroupResponseDTO"
      security:
      - BearerAuth: []
  /api/v1/groups:
    get:
      tags:
      - Grupos
      summary: Listar grupos
      description: "Lista apenas os grupos e Caixinhas de que o usuário autenticado\
        \ participa, do mais antigo para o mais recente, com os membros de cada um."
      operationId: listGroups
      responses:
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Unprocessable Content
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Grupos do usuário
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupResponseDTO"
      security:
      - BearerAuth: []
    post:
      tags:
      - Grupos
      summary: Criar grupo
      description: "Cria um grupo com ID do cliente; o usuário autenticado vira o\
        \ Admin. Reenvio do mesmo ID por quem já participa do grupo devolve o grupo\
        \ existente, sem duplicar. ID de grupo de que o usuário não participa responde\
        \ 404."
      operationId: createGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequestDTO"
        required: true
      responses:
        "404":
          description: Usuário não encontrado ou ID pertence a outro grupo
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Nome do grupo inválido
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Dados inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "201":
          description: "Grupo criado (ou já existente, no reenvio)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GroupResponseDTO"
      security:
      - BearerAuth: []
  /api/v1/groups/{id}/invitations:
    post:
      tags:
      - Grupos
      summary: Gerar convite
      description: "Gera um código de convite de uso único, válido por 7 dias (L-05).\
        \ Somente o Admin convida (L-10)."
      operationId: createGroupInvitation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Grupo não encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Usuário não é o Admin do grupo
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Unprocessable Content
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "201":
          description: Convite gerado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GroupInvitationResponseDTO"
      security:
      - BearerAuth: []
  /api/v1/groups/{groupId}/goals:
    post:
      tags:
      - Metas
      summary: Criar meta
      description: "Cria uma Caixinha no grupo. Só o Admin cria metas (L-17). A moeda\
        \ da meta é a moeda do perfil de quem cria (AD-12). O id é gerado no app:\
        \ o reenvio com o mesmo id por um membro do mesmo grupo devolve a meta existente,\
        \ sem alterá-la, também com 201 (seção 6.4, N4). A Caixinha individual é uma\
        \ meta num grupo com um membro só (L-06)."
      operationId: create
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoalRequestDTO"
        required: true
      responses:
        "404":
          description: "Grupo não encontrado, ou id de meta de outro grupo"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Membro que não é Admin (L-17)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Prazo no passado (INVALID_GOAL_DEADLINE)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: "Dados inválidos (ex.: valor da meta zero ou negativo)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "201":

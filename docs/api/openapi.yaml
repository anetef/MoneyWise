openapi: 3.1.0
info:
  title: MoneyWise API
  description: |
    API REST do MoneyWise.

    ## Formato de erro
    Todo erro segue o formato `ErrorResponse`:
    `code` (identificador estável para o app), `message` (texto em português)
    e `fields` (campos inválidos; vazio quando não se aplica).

    | Status | Quando |
    |---|---|
    | 400 | Dados inválidos (Bean Validation) ou requisição mal formatada |
    | 403 | O usuário não tem permissão para a operação |
    | 404 | Recurso não encontrado |
    | 409 | Conflito, como e-mail já cadastrado |
    | 422 | Regra de negócio violada, como alterar transação de mês fechado |
    | 500 | Erro inesperado no servidor |

    O 422 é usado quando a requisição está bem formada, mas viola uma regra de
    negócio (RN). O 400 fica reservado para dados mal formados ou inválidos.
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: Transações
  description: "Consulta, criação, edição e exclusão de transações do usuário autenticado"
- name: Relatórios
  description: Resumo financeiro mensal do usuário autenticado
- name: Autenticação
  description: Cadastro e login
paths:
  /api/v1/transactions/{id}:
    put:
      tags:
      - Transações
      summary: Editar transação
      description: Atualiza transação própria. updatedAt evita que uma alteração antiga
        sobrescreva a mais recente; registros de outro usuário ou de mês fechado não
        são editáveis.
      operationId: updateTransaction
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTransactionRequestDTO"
        required: true
      responses:
        "404":
          description: Transação não encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Transação em mês fechado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Dados inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Transação atualizada ou versão mais recente devolvida
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionResponseDTO"
      security:
      - BearerAuth: []
    delete:
      tags:
      - Transações
      summary: Excluir transação
      description: Exclui transação própria. Registro de outro usuário retorna 404;
        mês fechado não pode ser excluído.
      operationId: deleteTransaction
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Transação não encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Transação em mês fechado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "204":
          description: Transação excluída
      security:
      - BearerAuth: []
  /api/v1/transactions:
    get:
      tags:
      - Transações
      summary: Listar transações
      description: Lista apenas as transações do usuário autenticado, com filtros combináveis e período válido. A ordenação é por data e ID decrescentes. A página começa em zero; o tamanho padrão é 20 e o máximo é 100.
      operationId: listTransactions
      parameters:
      - name: category
        in: query
        description: Filtro opcional por categoria; espaços externos são removidos
        required: false
        schema:
          type: string
      - name: from
        in: query
        description: Data inicial inclusiva no formato AAAA-MM-DD
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: Data final inclusiva no formato AAAA-MM-DD
        required: false
        schema:
          type: string
          format: date
      - name: page
        in: query
        description: Índice da página, começando em zero
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        description: Quantidade de itens por página (1 a 100)
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          minimum: 1
          maximum: 100
      responses:
        "200":
          description: Página de transações
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionPageResponseDTO"
        "400":
          description: Filtros ou paginação inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - BearerAuth: []
    post:
      tags:
      - Transações
      summary: Criar transação
      description: Cria transação com ID do cliente; reenvio do mesmo ID pelo mesmo
        usuário é idempotente. A moeda vem do perfil. Transações de mês fechado são
        rejeitadas.
      operationId: createTransaction
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionRequestDTO"
        required: true
      responses:
        "404":
          description: Usuário não encontrado ou ID pertence a outro usuário
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Transação em mês fechado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Dados inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "201":
          description: Transação criada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionResponseDTO"
      security:
      - BearerAuth: []
  /api/v1/reports/monthly:
    get:
      tags:
      - Relatórios
      summary: Consultar resumo mensal
      description: Retorna receitas, despesas, saldo e despesas por categoria no mês informado. Os valores usam a moeda do perfil e consideram somente o usuário autenticado.
      operationId: getMonthlyTransactionSummary
      parameters:
      - name: month
        in: query
        description: Mês no formato AAAA-MM
        required: true
        example: 2026-10
        schema:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        "200":
          description: Resumo mensal
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MonthlyTransactionSummaryResponseDTO"
        "400":
          description: Mês inválido
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Usuário não encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - BearerAuth: []
  /api/v1/auth/verify-email:
    post:
      tags:
      - Autenticação
      summary: Confirmar e-mail
      description: |
        Confere o código de 6 dígitos enviado por e-mail no cadastro. Se estiver certo, confirma o e-mail
        e já devolve os tokens e os dados do usuário, no mesmo formato do login.

        Erros: 400 (campos inválidos), 409 `EMAIL_ALREADY_VERIFIED`,
        422 `INVALID_VERIFICATION_CODE` (código errado, ou e-mail sem código pendente),
        422 `VERIFICATION_CODE_EXPIRED` (passou de 15 minutos),
        422 `VERIFICATION_ATTEMPTS_EXCEEDED` (5 tentativas erradas; peça um novo código).
      operationId: verifyEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequestDTO"
        required: true
      responses:
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Unprocessable Content
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponseDTO"
  /api/v1/auth/resend-verification:
    post:
      tags:
      - Autenticação
      summary: Reenviar código de confirmação
      description: |
        Gera um novo código e envia por e-mail. O código anterior deixa de valer.
        Responde 204 também quando o e-mail não existe ou já foi confirmado, para não revelar
        quais e-mails têm conta.

        Erros: 400 (e-mail inválido), 429 `VERIFICATION_RESEND_TOO_SOON` (menos de 1 minuto desde o último envio).
      operationId: resendVerification
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequestDTO"
        required: true
      responses:
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Unprocessable Content
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "204":
          description: No Content
  /api/v1/auth/register:
    post:
      tags:
      - Autenticação
      summary: Cadastrar usuário
      description: |
        Cria o usuário com o e-mail **não confirmado** e devolve os dados dele, **sem tokens**.
        O app deve levar o usuário para a confirmação do e-mail; o login só é liberado depois dela.

        Erros: 400 (campos inválidos), 409 `EMAIL_ALREADY_IN_USE` (e-mail já cadastrado),
        422 `INVALID_CURRENCY` (moeda inexistente).
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequestDTO"
        required: true
      responses:
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Unprocessable Content
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponseDTO"
  /api/v1/auth/refresh:
    post:
      tags:
      - Autenticação
      summary: Renovar access token
      description: |
        Troca um refresh token válido por um novo access token **e** um novo refresh token (rotação, L-01).
        O refresh token enviado deixa de valer; o app deve guardar o novo.

        Erros: 400 (campo vazio), 401 `INVALID_REFRESH_TOKEN` (token inválido, vencido ou revogado:
        o app deve mandar o usuário para o login).
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequestDTO"
        required: true
      responses:
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Unprocessable Content
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenResponseDTO"
  /api/v1/auth/logout:
    post:
      tags:
      - Autenticação
      summary: Logout
      description: |
        Revoga o refresh token informado: depois disso, ele não gera novos access tokens.
        Responde 204 mesmo se o token já estiver revogado ou não existir.
        O access token atual continua válido até vencer (no máximo 15 min); o app deve apagar os dois.

        Erros: 400 (campo vazio).
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequestDTO"
        required: true
      responses:
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Unprocessable Content
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "204":
          description: No Content
  /api/v1/auth/login:
    post:
      tags:
      - Autenticação
      summary: Login
      description: |
        Valida e-mail e senha e devolve o access token, o refresh token e os dados do usuário.

        Erros: 400 (campos vazios), 401 `INVALID_CREDENTIALS` (e-mail inexistente ou senha errada,
        sempre com a mesma mensagem), 403 `EMAIL_NOT_VERIFIED` (senha certa, e-mail não confirmado).
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequestDTO"
        required: true
      responses:
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Unprocessable Content
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponseDTO"
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/InvalidField"
    InvalidField:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    UpdateTransactionRequestDTO:
      type: object
      properties:
        amount:
          type: number
          minimum: 0.01
        date:
          type: string
          format: date
        category:
          type: string
          minLength: 1
        type:
          type: string
          enum:
          - INCOME
          - EXPENSE
        description:
          type: string
        updatedAt:
          type: string
          format: date-time
      required:
      - amount
      - category
      - date
      - type
      - updatedAt
    TransactionResponseDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: number
        currency:
          type: string
        date:
          type: string
          format: date
        category:
          type: string
        type:
          type: string
          enum:
          - INCOME
          - EXPENSE
        description:
          type: string
        updatedAt:
          type: string
          format: date-time
    TransactionPageResponseDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/TransactionResponseDTO"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        hasNext:
          type: boolean
      required:
      - content
      - page
      - size
      - totalElements
      - totalPages
      - hasNext
    MonthlyTransactionSummaryResponseDTO:
      type: object
      properties:
        month:
          type: string
          pattern: '^\d{4}-\d{2}$'
          example: 2026-10
        currency:
          type: string
          example: BRL
        totalIncome:
          type: number
          example: 3500.00
        totalExpense:
          type: number
          example: 1200.50
        balance:
          type: number
          example: 2299.50
        expensesByCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategoryExpenseDTO"
      required:
      - month
      - currency
      - totalIncome
      - totalExpense
      - balance
      - expensesByCategory
    CategoryExpenseDTO:
      type: object
      properties:
        category:
          type: string
          example: Alimentação
        amount:
          type: number
          example: 450.00
      required:
      - category
      - amount
    CreateTransactionRequestDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: number
          minimum: 0.01
        date:
          type: string
          format: date
        category:
          type: string
          minLength: 1
        type:
          type: string
          enum:
          - INCOME
          - EXPENSE
        description:
          type: string
      required:
      - amount
      - category
      - date
      - id
      - type
    VerifyEmailRequestDTO:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        code:
          type: string
          minLength: 1
          pattern: "\\d{6}"
      required:
      - code
      - email
    LoginResponseDTO:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
        user:
          $ref: "#/components/schemas/UserResponseDTO"
    UserResponseDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
